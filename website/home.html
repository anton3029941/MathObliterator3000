<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>MathObliterator3000</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <script src="https://polyfill.io"></script>
        <script id="MathJax-script" async src="https://jsdelivr.net"></script>
    </head>
    <body>
        <h2>upload a pic</h2>
        <form id="upload-form" action="/solve" method="POST" enctype="multipart/form-data">
            <input type="file" id="image-file" name="image_file" accept="image/*" required>
            <button type="submit">Upload</button>
        </form>

        <script>
            document.addEventListener('paste', function (event) {
                const items = (event.clipboardData || event.originalEvent.clipboardData).items;

                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        const file = items[i].getAsFile();
                        
                        const fileInput = document.getElementById('image-file');

                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(file);

                        fileInput.files = dataTransfer.files;
                        break; 
                    }
                }
            });
        </script>

    </body>
</html>
